syntax = "proto3";

package leilao;

// Na estrutura message Atualizacao, definimos os dados enviados pelo servidor
// na parte service, definimos os métodos remotos. O FazerLance recebe um lance 
// e devolve uma resposta, enquanto o AcompanharLeilao utiliza streaming para enviar 
// várias atualizações aos participantes.

service Leilao {
    rpc FazerLance (LanceRequest) returns (LanceResponse);
    rpc AcompanharLeilao (Vazio) returns (stream Atualizacao);
}

message Vazio {
    string participante = 1;
}

message LanceRequest {
    string participante = 1;
    double valor = 2;
}

message LanceResponse {
    bool sucesso = 1;
    string mensagem = 2;
}

message Atualizacao {
    string item = 1;
    string participante = 2;
    double valor = 3;
    string mensagem = 4;
}
